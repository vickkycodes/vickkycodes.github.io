<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Bubble chart of four customer segments by recency and revenue" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="600" height="400" fill="#1b1f2a"/><text x="300" y="30" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#8a93a6">Customer segments: revenue vs. time since last order</text><g stroke="#8a93a6" opacity=".35"><line x1="70" y1="335" x2="540" y2="335"/><line x1="70" y1="50" x2="70" y2="335"/></g><text x="305" y="360" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8a93a6">Days since last order (avg)  →</text><text x="22" y="195" transform="rotate(-90 22 195)" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#8a93a6">Total revenue (avg)  →</text><circle cx="465" cy="277" r="18" fill="#e76f8a" opacity=".8"/><text x="465" y="251" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e8ecf4">Lapsed</text><circle cx="360" cy="122" r="27" fill="#f4a261" opacity=".8"/><text x="360" y="88" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e8ecf4">High-value, cooling</text><circle cx="281" cy="265" r="33" fill="#2ec4b6" opacity=".8"/><text x="281" y="224" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e8ecf4">Frequent, low basket</text><circle cx="165" cy="253" r="24" fill="#8d99ff" opacity=".8"/><text x="165" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#e8ecf4">New & bursty</text><text x="300" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" letter-spacing="3" fill="#e8ecf4">CUSTOMER SEGMENTATION</text></svg>