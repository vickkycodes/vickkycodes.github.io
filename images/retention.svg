<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Annual revenue at risk versus net recoverable value, and churn rate by contract type" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="600" height="400" fill="#1b1f2a"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="13" fill="#8a93a6">ANNUAL REVENUE AT RISK</text><rect x="40" y="62" width="520" height="34" rx="5" fill="#e76f8a"/><text x="52" y="85" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1b1f2a">$2.55M</text><text x="40" y="132" font-family="Arial,sans-serif" font-size="13" fill="#8a93a6">NET VALUE RECOVERABLE WITH TARGETED RETENTION (EST.)</text><rect x="40" y="142" width="249" height="34" rx="5" fill="#2ec4b6"/><text x="52" y="165" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#1b1f2a">$1.22M</text><text x="40" y="228" font-family="Arial,sans-serif" font-size="13" fill="#8a93a6">CHURN RATE BY CONTRACT TYPE</text><text x="40" y="261" font-family="Arial,sans-serif" font-size="13" fill="#e8ecf4">Month-to-month</text><rect x="170" y="244" width="330" height="22" rx="4" fill="#f4a261"/><text x="508" y="261" font-family="Arial,sans-serif" font-size="13" fill="#e8ecf4">42.7%</text><text x="40" y="295" font-family="Arial,sans-serif" font-size="13" fill="#e8ecf4">One year</text><rect x="170" y="278" width="87" height="22" rx="4" fill="#f4a261"/><text x="265" y="295" font-family="Arial,sans-serif" font-size="13" fill="#e8ecf4">11.3%</text><text x="40" y="329" font-family="Arial,sans-serif" font-size="13" fill="#e8ecf4">Two year</text><rect x="170" y="312" width="22" height="22" rx="4" fill="#f4a261"/><text x="200" y="329" font-family="Arial,sans-serif" font-size="13" fill="#e8ecf4">2.8%</text><text x="300" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" letter-spacing="3" fill="#e8ecf4">CUSTOMER RETENTION</text></svg>